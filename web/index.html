<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="OmnyShell web client — connect to a Hub, discover nodes, and manage sessions from the browser.">
    <title>OmnyShell</title>

    <!-- Progressive Web App -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" id="theme-color" content="#0f1318">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- iOS standalone / home-screen support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="OmnyShell">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

    <link rel="stylesheet" href="styles.css">
    <!-- xterm.js for the interactive terminal — self-hosted (see web/vendor/xterm)
         so a strict CSP needs no third-party origins. The UMD bundles expose the
         globals `Terminal` and `FitAddon`. -->
    <link rel="stylesheet" href="vendor/xterm/xterm.min.css">
    <script src="vendor/xterm/xterm.min.js"></script>
    <script src="vendor/xterm/addon-fit.min.js"></script>
    <!-- Pre-paint theme + service-worker registration (external so the deployed
         CSP can use `script-src 'self'` with no inline scripts). -->
    <script src="boot.js"></script>
    <script defer src="main.dart.js"></script>
</head>
<body>
    <div id="app" aria-busy="true">
        <div class="center-host"><span class="spinner" role="status" aria-label="Loading"></span></div>
    </div>
    <div id="toasts" aria-live="polite" aria-atomic="false"></div>
</body>
</html>
