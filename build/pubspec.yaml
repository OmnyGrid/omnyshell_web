name: omnyshell_web
description: >-
  A browser client for OmnyShell — connect to a Hub, discover nodes, run
  interactive sessions — and the reusable library behind it: embed a real remote
  shell terminal, or its UI kit, in any Dart web app.
version: 1.15.0
repository: https://github.com/OmnyGrid/omnyshell_web
topics:
  - terminal
  - ssh
  - web
  - pwa

environment:
  sdk: ^3.12.2

dependencies:
  omnyshell: ^1.56.1
  web: ^1.1.1
  # The `:ide` agent panel gates its run_command tool with the same shield the
  # CLI uses; it's browser-safe (dart:io-free) and already pulled in by
  # omnyshell, so depend on it directly.
  command_shield: ^1.4.0

dev_dependencies:
  build_runner: ^2.15.1
  build_web_compilers: ^4.8.0
  image: ^4.9.1
  lints: ^6.1.0
  test: ^1.31.2
